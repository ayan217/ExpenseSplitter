<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense Splitter</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7fb;
      color: #172033;
    }
    .container { width: min(1000px, calc(100% - 32px)); margin: 40px auto; }
    h1 { margin: 0 0 8px; font-size: 30px; }
    .subtitle { color: #667085; margin: 0 0 28px; }
    .card {
      background: white;
      border: 1px solid #e4e7ec;
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: 0 2px 8px rgba(16, 24, 40, .04);
    }
    .card h2 { margin: 0 0 16px; font-size: 18px; }
    .person-card {
      border: 1px solid #eaecf0;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .person-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .person-header input { flex: 1; font-weight: 600; }
    .contribution {
      display: grid;
      grid-template-columns: 1fr 42px;
      gap: 8px;
      margin-bottom: 8px;
    }
    input {
      width: 100%;
      border: 1px solid #d0d5dd;
      border-radius: 9px;
      padding: 10px 12px;
      font-size: 15px;
      outline: none;
    }
    input:focus { border-color: #667085; }
    button {
      border: 0;
      border-radius: 9px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .primary { background: #172033; color: white; }
    .secondary { background: #eef2f6; color: #172033; }
    .danger { background: #fff0f0; color: #b42318; }
    .small { font-size: 13px; padding: 8px 11px; }
    .person-total {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #eaecf0;
      display: flex;
      justify-content: space-between;
      color: #667085;
      font-size: 14px;
    }
    .person-total strong { color: #172033; font-size: 16px; }
    .actions { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .metric { background: #f8fafc; border-radius: 10px; padding: 16px; }
    .metric-label { color: #667085; font-size: 13px; margin-bottom: 5px; }
    .metric-value { font-size: 22px; font-weight: 700; }
    table { width: 100%; border-collapse: collapse; }
    th, td {
      text-align: left;
      padding: 13px 10px;
      border-bottom: 1px solid #eaecf0;
    }
    th { font-size: 13px; color: #667085; }
    td { font-size: 14px; }
    .positive { color: #027a48; font-weight: 700; }
    .negative { color: #b42318; font-weight: 700; }
    .settlement {
      padding: 13px 15px;
      background: #f8fafc;
      border-radius: 9px;
      margin-bottom: 9px;
    }
    .empty { color: #667085; padding: 8px 0; }
    @media (max-width: 650px) {
      .summary { grid-template-columns: 1fr; }
      .container { margin: 24px auto; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Expense Splitter</h1>
    <p class="subtitle">Add people and record multiple contributions for each person.</p>

    <div class="card">
      <h2>People & Contributions</h2>
      <div id="people"></div>
      <div class="actions">
        <button class="secondary" onclick="addPerson()">+ Add Person</button>
        <button class="primary" onclick="exportSheet()">Export Sheet</button>
      </div>
    </div>

    <div class="card">
      <h2>Summary</h2>
      <div class="summary">
        <div class="metric">
          <div class="metric-label">Total Amount</div>
          <div class="metric-value" id="total">₹0.00</div>
        </div>
        <div class="metric">
          <div class="metric-label">People</div>
          <div class="metric-value" id="count">0</div>
        </div>
        <div class="metric">
          <div class="metric-label">Equal Share Per Person</div>
          <div class="metric-value" id="share">₹0.00</div>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Final Balance</h2>
      <table>
        <thead>
          <tr>
            <th>Person</th>
            <th>Total Paid</th>
            <th>Equal Share</th>
            <th>Balance</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="balances"></tbody>
      </table>
    </div>

    <div class="card">
      <h2>Who Pays Whom</h2>
      <div id="settlements" class="empty">Add contributions to see settlements.</div>
    </div>
  </div>

<script>
  let people = [
    { name: "A", contributions: [0] },
    { name: "B", contributions: [0] },
    { name: "C", contributions: [0] }
  ];

  const money = value =>
    new Intl.NumberFormat("en-IN", {
      style: "currency",
      currency: "INR",
      minimumFractionDigits: 2
    }).format(value);

  function addPerson() {
    people.push({
      name: `Person ${people.length + 1}`,
      contributions: [0]
    });
    render();
  }

  function removePerson(index) {
    if (people.length <= 1) return;
    people.splice(index, 1);
    render();
  }

  function addContribution(personIndex) {
    people[personIndex].contributions.push(0);
    render();
    setTimeout(() => {
      const inputs = document.querySelectorAll(
        `[data-person="${personIndex}"] .contribution-input`
      );
      if (inputs.length) inputs[inputs.length - 1].focus();
    }, 0);
  }

  function removeContribution(personIndex, contributionIndex) {
    const contributions = people[personIndex].contributions;
    if (contributions.length <= 1) {
      contributions[0] = 0;
    } else {
      contributions.splice(contributionIndex, 1);
    }
    render();
  }

  function updateName(index, value) {
    people[index].name = value;
    calculate();
  }

  function updateContribution(personIndex, contributionIndex, value) {
    const amount = parseFloat(value);
    people[personIndex].contributions[contributionIndex] =
      Number.isFinite(amount) && amount >= 0 ? amount : 0;
    calculate();
  }

  function getPersonTotal(person) {
    return person.contributions.reduce((sum, amount) => sum + amount, 0);
  }


  function exportSheet() {
    const totals = people.map(getPersonTotal);
    const total = totals.reduce((sum, amount) => sum + amount, 0);
    const share = people.length ? total / people.length : 0;

    const rows = [];

    // Summary section
    rows.push(["EXPENSE SPLITTER"]);
    rows.push([]);
    rows.push(["Summary"]);
    rows.push(["Total Amount", total]);
    rows.push(["Number of People", people.length]);
    rows.push(["Equal Share Per Person", share]);
    rows.push([]);

    // Detailed contributions
    rows.push(["Contributions"]);
    rows.push(["Person", "Contribution #", "Amount"]);

    people.forEach((person, personIndex) => {
      person.contributions.forEach((amount, contributionIndex) => {
        rows.push([
          person.name || "Unnamed",
          contributionIndex + 1,
          amount
        ]);
      });
      rows.push([
        person.name || "Unnamed",
        "Total",
        totals[personIndex]
      ]);
    });

    rows.push([]);
    rows.push(["Final Balance"]);
    rows.push(["Person", "Total Paid", "Equal Share", "Balance", "Status"]);

    people.forEach((person, index) => {
      const balance = totals[index] - share;
      let status = "Settled";
      if (balance > 0.005) status = "Should Receive";
      if (balance < -0.005) status = "Needs to Pay";

      rows.push([
        person.name || "Unnamed",
        totals[index],
        share,
        balance,
        status
      ]);
    });

    // Calculate settlements
    const creditors = people
      .map((p, i) => ({
        name: p.name || "Unnamed",
        amount: totals[i] - share
      }))
      .filter(p => p.amount > 0.005)
      .sort((a, b) => b.amount - a.amount);

    const debtors = people
      .map((p, i) => ({
        name: p.name || "Unnamed",
        amount: share - totals[i]
      }))
      .filter(p => p.amount > 0.005)
      .sort((a, b) => b.amount - a.amount);

    rows.push([]);
    rows.push(["Who Pays Whom"]);
    rows.push(["From", "To", "Amount"]);

    let i = 0;
    let j = 0;

    while (i < debtors.length && j < creditors.length) {
      const amount = Math.min(debtors[i].amount, creditors[j].amount);

      rows.push([
        debtors[i].name,
        creditors[j].name,
        amount
      ]);

      debtors[i].amount -= amount;
      creditors[j].amount -= amount;

      if (debtors[i].amount <= 0.005) i++;
      if (creditors[j].amount <= 0.005) j++;
    }

    // CSV generation
    const csv = rows.map(row =>
      row.map(value => {
        const text = value === undefined || value === null ? "" : String(value);
        return '"' + text.replaceAll('"', '""') + '"';
      }).join(",")
    ).join("\r\n");

    const blob = new Blob(["\uFEFF" + csv], {
      type: "text/csv;charset=utf-8;"
    });

    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;

    const date = new Date().toISOString().slice(0, 10);
    link.download = `expense-splitter-${date}.csv`;

    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
  }

  function render() {
    const container = document.getElementById("people");
    container.innerHTML = "";

    people.forEach((person, personIndex) => {
      const card = document.createElement("div");
      card.className = "person-card";
      card.dataset.person = personIndex;

      card.innerHTML = `
        <div class="person-header">
          <input
            type="text"
            value="${escapeHtml(person.name)}"
            placeholder="Person name"
            oninput="updateName(${personIndex}, this.value)"
          />
          <button class="danger" onclick="removePerson(${personIndex})" title="Remove person">×</button>
        </div>
        <div class="contributions"></div>
        <button class="secondary small" onclick="addContribution(${personIndex})">
          + Add Amount
        </button>
        <div class="person-total">
          <span>Total contributed</span>
          <strong>${money(getPersonTotal(person))}</strong>
        </div>
      `;

      const contributionsContainer = card.querySelector(".contributions");

      person.contributions.forEach((amount, contributionIndex) => {
        const row = document.createElement("div");
        row.className = "contribution";
        row.innerHTML = `
          <input
            class="contribution-input"
            type="number"
            min="0"
            step="0.01"
            value="${amount}"
            placeholder="Amount"
            oninput="updateContribution(${personIndex}, ${contributionIndex}, this.value)"
          />
          <button
            class="danger"
            onclick="removeContribution(${personIndex}, ${contributionIndex})"
            title="Remove amount"
          >×</button>
        `;
        contributionsContainer.appendChild(row);
      });

      container.appendChild(card);
    });

    calculate();
  }

  function escapeHtml(value) {
    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function calculate() {
    const totals = people.map(getPersonTotal);
    const total = totals.reduce((sum, amount) => sum + amount, 0);
    const count = people.length;
    const share = count ? total / count : 0;

    document.getElementById("total").textContent = money(total);
    document.getElementById("count").textContent = count;
    document.getElementById("share").textContent = money(share);

    const balances = document.getElementById("balances");

    balances.innerHTML = people.map((person, index) => {
      const paid = totals[index];
      const balance = paid - share;
      const epsilon = 0.005;

      let status = "Settled";
      if (balance > epsilon) status = "Should Receive";
      if (balance < -epsilon) status = "Needs to Pay";

      const balanceText =
        balance > epsilon ? "+" + money(balance) :
        balance < -epsilon ? "-" + money(Math.abs(balance)) :
        money(0);

      const className =
        balance > epsilon ? "positive" :
        balance < -epsilon ? "negative" : "";

      return `
        <tr>
          <td>${escapeHtml(person.name || "Unnamed")}</td>
          <td>${money(paid)}</td>
          <td>${money(share)}</td>
          <td class="${className}">${balanceText}</td>
          <td class="${className}">${status}</td>
        </tr>
      `;
    }).join("");

    calculateSettlements(totals, share);
  }

  function calculateSettlements(totals, share) {
    const creditors = people
      .map((p, i) => ({
        name: p.name || "Unnamed",
        amount: totals[i] - share
      }))
      .filter(p => p.amount > 0.005)
      .sort((a, b) => b.amount - a.amount);

    const debtors = people
      .map((p, i) => ({
        name: p.name || "Unnamed",
        amount: share - totals[i]
      }))
      .filter(p => p.amount > 0.005)
      .sort((a, b) => b.amount - a.amount);

    const settlements = [];
    let i = 0;
    let j = 0;

    while (i < debtors.length && j < creditors.length) {
      const amount = Math.min(debtors[i].amount, creditors[j].amount);

      settlements.push({
        from: debtors[i].name,
        to: creditors[j].name,
        amount
      });

      debtors[i].amount -= amount;
      creditors[j].amount -= amount;

      if (debtors[i].amount <= 0.005) i++;
      if (creditors[j].amount <= 0.005) j++;
    }

    const container = document.getElementById("settlements");

    if (!settlements.length) {
      container.className = "empty";
      container.textContent = "Everyone is already settled.";
      return;
    }

    container.className = "";
    container.innerHTML = settlements.map(s => `
      <div class="settlement">
        <strong>${escapeHtml(s.from)}</strong>
        pays
        <strong>${money(s.amount)}</strong>
        to
        <strong>${escapeHtml(s.to)}</strong>
      </div>
    `).join("");
  }

  render();
</script>
</body>
</html>
